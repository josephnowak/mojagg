name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ruff (Python)
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --output-format=github"

      - name: ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: mojo format check
        run: pixi run mojo format --check src/ tests/mojo/ || true   # enforce once sources land

      - name: Mojo conventions lint
        run: pixi run python scripts/lint_mojo.py

  test-mojo:
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - name: mojo test
        run: pixi run test-mojo

  test-python:
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        environment: ["py310", "py311", "py312", "py313", "py314"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          environments: ${{ matrix.environment }}
          activate-environment: ${{ matrix.environment }}
      - name: Build extension
        run: pixi run -e ${{ matrix.environment }} build-ext
      - name: Parity tests vs numbagg (skip GPU)
        run: pixi run -e ${{ matrix.environment }} test

  wheel-build:
    runs-on: ${{ matrix.os }}
    needs: [test-mojo, test-python]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - name: Build wheel
        run: pixi run build-wheel
      - name: Repair wheel
        run: |
          mkdir -p dist/repaired
          if [ "${{ runner.os }}" = "Linux" ]; then
            pixi run auditwheel repair dist/*.whl -w dist/repaired
          elif [ "${{ runner.os }}" = "macOS" ]; then
            pixi run delocate-wheel -w dist/repaired -v dist/*.whl
          fi
      - name: Smoke-test installed wheel
        run: |
          WHEEL=$(ls dist/repaired/*.whl 2>/dev/null || ls dist/*.whl)
          pixi run python -m pip install --force-reinstall "$WHEEL"
          pixi run python -c "import mojagg, numpy as np; a=np.arange(10,dtype=np.float64); a[3]=np.nan; print('wheel smoke test:', mojagg.nansum(a))"
      - name: Check wheel size budget
        run: python scripts/check_wheel_size.py --max-mb 20 dist/*.whl dist/repaired/*.whl
