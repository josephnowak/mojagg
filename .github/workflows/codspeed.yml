name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    # Fork pull requests cannot obtain the OIDC token. They are covered by the
    # normal CI tests; trusted branches run the actual CodSpeed recorder.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Build extension
        run: pixi run build-ext

      - name: Run lightweight CodSpeed suite
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: pixi run pytest benchmarks/codspeed --codspeed -q
