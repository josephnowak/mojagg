name: Mojo toolchain watch

# Check Modular MAX weekly. A new release produces a draft upgrade PR after
# the complete native and parity checks pass. Release-note signals in the PR
# body point reviewers at likely follow-up refactors, such as replacing a
# workaround when parameterized traits or tuple generics become available.

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check latest Modular release
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");

            function versionTuple(version) {
              return version.split(".").map(Number);
            }

            function compareVersions(left, right) {
              const a = versionTuple(left);
              const b = versionTuple(right);
              for (let index = 0; index < 3; index += 1) {
                if ((a[index] || 0) !== (b[index] || 0)) {
                  return (a[index] || 0) - (b[index] || 0);
                }
              }
              return 0;
            }

            const release = await github.rest.repos.getLatestRelease({
              owner: "modular",
              repo: "max",
            });
            const tag = release.data.tag_name;
            const versionMatch = tag.match(/(\d+\.\d+\.\d+)/);
            if (!versionMatch) {
              core.setFailed(`Could not extract a MAX version from ${tag}`);
              return;
            }
            const latest = versionMatch[1];
            const pixi = fs.readFileSync("pixi.toml", "utf8");
            const lock = fs.readFileSync("pixi.lock", "utf8");
            const specMatch = pixi.match(/^max\s*=\s*"([^"]+)"/m);
            const lowerMatch = specMatch && specMatch[1].match(/>=\s*(\d+\.\d+\.\d+)/);
            const lockMatch = lock.match(/\/max-(\d+\.\d+\.\d+)-/);
            const resolved = lockMatch ? lockMatch[1] : (lowerMatch && lowerMatch[1]);
            if (!resolved) {
              core.setFailed("Could not determine the current MAX version");
              return;
            }

            const notes = release.data.body || "";
            const lowerNotes = notes.toLowerCase();
            const signals = [
              "trait",
              "parameter",
              "parametr",
              "variadic",
              "tuple",
              "generic",
              "reflection",
              "compile-time",
              "stdlib",
              "algorithm",
            ].filter((term) => lowerNotes.includes(term));

            core.setOutput("latest", latest);
            core.setOutput("resolved", resolved);
            core.setOutput("url", release.data.html_url);
            core.setOutput("signals", JSON.stringify(signals));
            core.setOutput("changed", compareVersions(latest, resolved) > 0 ? "true" : "false");

      - name: Set up Pixi
        if: steps.check.outputs.changed == 'true'
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Update MAX requirement
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@v9
        env:
          LATEST_MAX: ${{ steps.check.outputs.latest }}
        with:
          script: |
            const fs = require("fs");
            const latest = process.env.LATEST_MAX;
            const major = Number(latest.split(".")[0]);
            const pixi = fs.readFileSync("pixi.toml", "utf8");
            const line = pixi.match(/^(max\s*=\s*")([^"]+)(")$/m);
            if (!line) {
              core.setFailed("Could not find the MAX requirement in pixi.toml");
              return;
            }
            const requirement = `>=${latest},<${major + 1}`;
            fs.writeFileSync(
              "pixi.toml",
              pixi.replace(line[0], `${line[1]}${requirement}${line[3]}`),
            );

      - name: Resolve and test the toolchain update
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          pixi install
          pixi run lint
          pixi run build-ext
          pixi run test-mojo
          pixi run test

      - name: Open draft MAX upgrade PR
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/mojo-max-${{ steps.check.outputs.latest }}
          delete-branch: true
          draft: true
          commit-message: "chore: update Mojo/MAX to ${{ steps.check.outputs.latest }}"
          title: "chore: update Mojo/MAX to ${{ steps.check.outputs.latest }}"
          labels: dependencies,mojo-upgrade
          body: |
            This draft PR updates the resolved Modular MAX/Mojo toolchain after the release detected by the weekly watcher.

            - Release: ${{ steps.check.outputs.url }}
            - Previous resolved MAX: `${{ steps.check.outputs.resolved }}`
            - New MAX: `${{ steps.check.outputs.latest }}`
            - Release-note signals: `${{ steps.check.outputs.signals }}`

            Review checklist:

            - [ ] Read the release notes for language and standard-library changes.
            - [ ] Inspect `src/mojagg/drivers/gufunc.mojo` and related workarounds for newly possible generic or trait abstractions.
            - [ ] Search for deprecated APIs and compiler workarounds.
            - [ ] Compare parity results and CodSpeed measurements with the previous toolchain.
            - [ ] Split any source refactor into a focused follow-up commit when useful.

      - name: Open issue when the upgrade cannot pass
        if: failure() && steps.check.outputs.changed == 'true'
        uses: actions/github-script@v9
        env:
          LATEST_MAX: ${{ steps.check.outputs.latest }}
          RESOLVED_MAX: ${{ steps.check.outputs.resolved }}
          RELEASE_URL: ${{ steps.check.outputs.url }}
        with:
          script: |
            const title = `Mojo/MAX ${process.env.LATEST_MAX} upgrade needs review`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "mojo-upgrade",
              per_page: 100,
            });
            if (existing.some((issue) => issue.title === title)) {
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["mojo-upgrade", "dependencies"],
              body: [
                `The weekly toolchain watcher found MAX/Mojo ${process.env.LATEST_MAX}; the repository currently resolves ${process.env.RESOLVED_MAX}.`,
                `Release notes: ${process.env.RELEASE_URL}`,
                "",
                "The automated upgrade did not pass resolution or validation. Inspect the logs, review compiler changes, and retry the upgrade manually.",
              ].join("\n"),
            });
